# Provisional seed-42 winner; no compressed runs evaluated yet.
[study]
seeds = [
    42,
]
rounds = 60
qsgd-levels = 127
llz-p-values = [
    0,
    1,
]
llz-window = 128

[task]
task-module = "flower_face.pretrained_task"
manifest = "data/digiface-resnet18/manifest.json"
