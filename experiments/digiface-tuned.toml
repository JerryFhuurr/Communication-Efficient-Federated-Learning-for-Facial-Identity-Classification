# Provisional settings selected from seed-42 uncompressed tuning on 2026-09-16.
# Best validation-loss checkpoint: round 60, accuracy 38.0%.
# Compression methods have not yet been compared using these settings.
[study]
seeds = [42]
rounds = 60
qsgd-levels = 127
llz-p-values = [0, 1]
llz-window = 128

[task]
task-module = "flower_face.task"
manifest = "data/digiface-100/manifest.json"
num-classes = 100
num-clients = 4
augmentation = "horizontal-flip"
image-size = 64
learning-rate = 0.1
weight-decay = 0.0
batch-size = 16
local-epochs = 1
