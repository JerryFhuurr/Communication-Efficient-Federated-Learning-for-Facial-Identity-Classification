[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-compression-demo"
version = "0.2.0"
description = "Reusable Flower and PyTorch experiments for QSGD and LLZ compression"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flwr[simulation]==1.36.0",
    "numpy>=1.26,<3",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "Pillow>=10,<12",
    "tomli-w>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
reports = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["flower_face*", "compression*", "federated_compression*"]

[tool.flwr.app]
publisher = "local"

[tool.flwr.app.components]
serverapp = "flower_face.server_app:app"
clientapp = "flower_face.client_app:app"

[tool.flwr.app.config]
task-module = "flower_face.task"
num-server-rounds = 3
evaluate-final-test = false
compression = "none"
qsgd-levels = 127
llz-p = 0
llz-window = 128
num-clients = 4
num-classes = 10
local-epochs = 1
batch-size = 16
learning-rate = 0.1
weight-decay = 0.0
augmentation = "horizontal-flip"
seed = 42
image-size = 64
manifest = "data/subset/manifest.json"
output-dir = "outputs"

[tool.pytest.ini_options]
testpaths = ["tests"]
